# Starfly 全套服務。部署請用 infra/scripts/deploy.sh，它會自動建立 .env 並套用這個檔案。
# 對外只開放 web（Caddy）的 80 / 443；資料庫與 API 只在 Compose 內部網路。
name: starfly

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請先執行 deploy.sh 產生密碼}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 一次性步驟：把素材 volume 的擁有者設成 api / worker 的執行帳號（uid 10001）。
  # volume 第一次被哪個容器掛載會決定它的擁有者，Caddy 先掛載時會變成 root，api 就無法寫入。
  media-init:
    build: ../services/api
    user: "0:0"
    command: ["chown", "10001:10001", "/media"]
    volumes:
      - media:/media
    restart: "no"
    healthcheck:
      disable: true

  api:
    build: ../services/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?請先執行 deploy.sh 產生 SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MEDIA_ROOT: /media
    volumes:
      - media:/media
    depends_on:
      postgres:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully

  # 背景任務：素材分析（FFmpeg 轉檔、切鏡頭、AI 標註）。與 api 使用同一份程式碼。
  worker:
    build: ../services/api
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?請先執行 deploy.sh 產生 SECRET_KEY}
      MEDIA_ROOT: /media
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      - media:/media
    # 停止時先讓 worker 中止 FFmpeg 並把任務放回佇列
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-heartbeat') > 60)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      # api 啟動時會先套用資料庫遷移
      api:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully

  web:
    build: ../apps/web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # 素材檔案由 Caddy 直接提供（先經 /api/media/auth 檢查權限），唯讀
      - media:/media:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg-data:
  # 素材原始檔、預覽檔與關鍵畫面（Docker 資料在 /data/docker，位於 150 GB 資料碟）
  media:
  caddy-data:
  caddy-config:
