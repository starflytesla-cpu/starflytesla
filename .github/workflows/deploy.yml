name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一時間只跑一個部署，後來的排隊，不取消進行中的部署
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$HOST" ]; then
            echo "::error::尚未設定 DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS / DEPLOY_HOST，見 docs/06-deploy.md"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # 伺服器端的金鑰被鎖定成只能執行 deploy.sh，這裡送出的字串會被驗證
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            "starfly@$HOST" "deploy ${GITHUB_REF_NAME} ${GITHUB_SHA}"
