# 每次推送自動跑測試與建置，只做檢查，不部署、不需要任何密鑰。
name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: starfly
          POSTGRES_PASSWORD: starfly
          POSTGRES_DB: starfly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U starfly" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://starfly:starfly@localhost:5432/starfly_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning infra/scripts/*.sh infra/bench/*.sh
