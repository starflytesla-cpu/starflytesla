# 在正式伺服器執行維運指令（見 infra/scripts/ops.sh）。
# - 手動執行：Actions → Ops → Run workflow，輸入指令（status / smoke / queue / logs api 200 / deploy / restart api）
# - 自動部署：CI 在 claude/exciting-fermi-nad1gj 分支通過後，自動執行 deploy
# 伺服器端的金鑰被鎖定成只能執行 ops.sh，這裡送出的指令會在伺服器上再驗證一次。
name: Ops

on:
  workflow_dispatch:
    inputs:
      command:
        description: "指令：status / smoke / queue / ai-check / backup / backups / verify / logs api 200 / deploy / restart worker"
        required: true
        default: status
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [claude/exciting-fermi-nad1gj]

concurrency:
  group: ops-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ops:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run on server
        env:
          SSH_KEY: ${{ secrets.OPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.OPS_HOST }}
          # 輸入值只經由環境變數傳遞，不直接嵌入指令，避免注入
          COMMAND: ${{ github.event_name == 'workflow_dispatch' && inputs.command || 'deploy' }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$HOST" ]; then
            echo "::warning::尚未設定 OPS_SSH_KEY / OPS_KNOWN_HOSTS / OPS_HOST，略過（見 docs/05-server-setup.md）"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ops_key
          chmod 600 ~/.ssh/ops_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # 每 15 秒送一次保持連線訊號：伺服器前端的防護設備會切斷閒置約 2 分鐘的連線，
          # 部署時的長時間步驟（例如下載程式碼逾時）才不會被中途切斷、看不到錯誤訊息
          ssh -i ~/.ssh/ops_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=12 \
            "root@$HOST" "$COMMAND"
